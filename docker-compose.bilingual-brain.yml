services:
  odysseus:
    environment:
      BILINGUAL_BRAIN_URL: "${BILINGUAL_BRAIN_URL}"
      BILINGUAL_BRAIN_USERNAME: "${BILINGUAL_BRAIN_USERNAME}"
      BILINGUAL_BRAIN_PASSWORD: "${BILINGUAL_BRAIN_PASSWORD}"
      BILINGUAL_BRAIN_TIMEOUT_SECONDS: "${BILINGUAL_BRAIN_TIMEOUT_SECONDS:-720}"
      BILINGUAL_BRAIN_SAVE_RECEIPTS: "${BILINGUAL_BRAIN_SAVE_RECEIPTS:-1}"
      BILINGUAL_BRAIN_RECEIPT_DIR: "${BILINGUAL_BRAIN_RECEIPT_DIR:-/app/workspace/bilingual-brain-receipts}"
